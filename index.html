!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nova AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0f;
    color: #fff;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
}

.app {
    height: 100vh;
    display: flex;
}

.sidebar {
    width: 250px;
    background: #111116;
    border-right: 1px solid #25252d;
    padding: 18px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 20px;
}

.new-chat {
    border: 1px solid #30303a;
    background: #18181f;
    color: white;
    padding: 12px;
    border-radius: 10px;
    cursor: pointer;
    text-align: left;
}

.new-chat:hover {
    background: #22222b;
}

.history {
    margin-top: 20px;
    overflow-y: auto;
    flex: 1;
}

.history-item {
    padding: 10px;
    color: #aaa;
    border-radius: 8px;
    cursor: pointer;
    margin-bottom: 4px;
    font-size: 14px;
}

.history-item:hover {
    background: #1d1d25;
    color: white;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    height: 60px;
    border-bottom: 1px solid #25252d;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 25px;
}

.status {
    color: #777;
    font-size: 13px;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 30px 20px;
}

.messages {
    max-width: 850px;
    margin: auto;
}

.welcome {
    height: 65vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align: center;
}

.welcome h1 {
    font-size: 38px;
    margin-bottom: 10px;
}

.welcome p {
    color: #888;
}

.message {
    display: flex;
    gap: 14px;
    margin: 25px 0;
    line-height: 1.6;
}

.avatar {
    width: 34px;
    height: 34px;
    min-width: 34px;
    border-radius: 9px;
    background: #22222b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
}

.user .avatar {
    background: #303044;
}

.content {
    white-space: pre-wrap;
    max-width: 760px;
}

.composer {
    padding: 15px 20px 25px;
}

form {
    max-width: 850px;
    margin: auto;
    background: #17171e;
    border: 1px solid #30303a;
    border-radius: 14px;
    display: flex;
    padding: 8px;
}

textarea {
    flex: 1;
    resize: none;
    border: none;
    outline: none;
    background: transparent;
    color: white;
    font-size: 16px;
    padding: 12px;
    min-height: 45px;
    max-height: 180px;
}

button.send {
    width: 45px;
    height: 45px;
    border: none;
    border-radius: 10px;
    background: white;
    color: black;
    cursor: pointer;
    font-size: 20px;
}

button.send:disabled {
    opacity: .4;
    cursor: not-allowed;
}

.disclaimer {
    max-width: 850px;
    margin: 8px auto 0;
    text-align: center;
    color: #555;
    font-size: 11px;
}

@media(max-width:700px) {
    .sidebar {
        display: none;
    }

    .welcome h1 {
        font-size: 29px;
    }

    .chat {
        padding: 20px 12px;
    }

    .composer {
        padding: 10px;
    }
}
</style>
</head>

<body>

<div class="app">

    <aside class="sidebar">

        <div class="logo">
            Nova AI
        </div>

        <button class="new-chat" onclick="newChat()">
            + Nouvelle conversation
        </button>

        <div class="history" id="history"></div>

    </aside>


    <main class="main">

        <header class="header">

            <div>
                Nova AI
            </div>

            <div class="status" id="status">
                Initialisation...
            </div>

        </header>


        <section class="chat" id="chat">

            <div class="messages" id="messages">

                <div class="welcome" id="welcome">

                    <h1>Comment puis-je t'aider ?</h1>

                    <p>
                        Une IA qui fonctionne directement dans ton navigateur.
                    </p>

                </div>

            </div>

        </section>


        <div class="composer">

            <form id="form">

                <textarea
                    id="input"
                    placeholder="Écris ton message..."
                    rows="1"
                ></textarea>

                <button
                    class="send"
                    id="send"
                    type="submit"
                >
                    ↑
                </button>

            </form>

            <div class="disclaimer">
                Nova AI utilise un modèle exécuté directement dans le navigateur.
            </div>

        </div>

    </main>

</div>


<script type="module">

import {
    pipeline
} from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.7.2";


const MODEL =
    "onnx-community/Qwen2.5-0.5B-Instruct";


let ai = null;

let conversation = [];


const input =
    document.getElementById("input");

const form =
    document.getElementById("form");

const send =
    document.getElementById("send");

const messages =
    document.getElementById("messages");

const chat =
    document.getElementById("chat");

const status =
    document.getElementById("status");

const history =
    document.getElementById("history");


async function loadAI() {

    if (ai) return ai;

    status.textContent =
        "Téléchargement du modèle...";

    send.disabled = true;

    try {

        ai = await pipeline(
            "text-generation",
            MODEL,
            {
                dtype: "q4",
                device: "webgpu"
            }
        );

    } catch {

        status.textContent =
            "Chargement du modèle...";

        ai = await pipeline(
            "text-generation",
            MODEL,
            {
                dtype: "q4"
            }
        );

    }

    status.textContent =
        "IA prête";

    send.disabled = false;

    return ai;
}


function addMessage(role, text) {

    const welcome =
        document.getElementById("welcome");

    if (welcome)
        welcome.remove();


    const message =
        document.createElement("div");

    message.className =
        "message " + role;


    const avatar =
        document.createElement("div");

    avatar.className =
        "avatar";

    avatar.textContent =
        role === "user"
            ? "Toi"
            : "N";


    const content =
        document.createElement("div");

    content.className =
        "content";

    content.textContent =
        text;


    message.appendChild(avatar);
    message.appendChild(content);

    messages.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;


    return content;
}


async function sendMessage() {

    const text =
        input.value.trim();

    if (!text)
        return;


    input.value = "";

    input.style.height =
        "auto";


    conversation.push({
        role: "user",
        content: text
    });


    addMessage(
        "user",
        text
    );


    const response =
        addMessage(
            "assistant",
            "Je réfléchis..."
        );


    send.disabled = true;


    try {

        const model =
            await loadAI();


        const prompt = [

            {
                role: "system",
                content:
                    `Tu es Nova AI.

Tu es un assistant intelligent, utile,
naturel et précis.

Réponds en français par défaut.

Aide l'utilisateur à écrire,
réfléchir, apprendre, programmer,
résoudre des problèmes et créer
des projets.

Ne prétends jamais avoir accès à
Internet ou à des outils que tu
n'as pas réellement.

Réponds directement sans phrases
inutiles.`
            },

            ...conversation.slice(-10)

        ];


        const result =
            await model(
                prompt,
                {
                    max_new_tokens: 500,
                    temperature: 0.7,
                    top_p: 0.9,
                    do_sample: true
                }
            );


        let answer =
            result[0]?.generated_text;


        if (Array.isArray(answer)) {

            answer =
                answer[
                    answer.length - 1
                ]?.content || "";

        }


        if (!answer)
            answer =
                "Je n'ai pas réussi à générer une réponse.";


        answer =
            String(answer).trim();


        response.textContent =
            answer;


        conversation.push({
            role: "assistant",
            content: answer
        });


        addHistory(text);


    } catch (error) {

        console.error(error);

        response.textContent =
            "Impossible de charger l'IA dans ce navigateur. Essaie Chrome ou Edge.";

    }


    send.disabled = false;

    input.focus();

}


function addHistory(text) {

    const item =
        document.createElement("div");

    item.className =
        "history-item";

    item.textContent =
        text.substring(0, 35);


    history.prepend(item);

}


function newChat() {

    conversation = [];

    messages.innerHTML = `

        <div class="welcome" id="welcome">

            <h1>
                Comment puis-je t'aider ?
            </h1>

            <p>
                Une IA qui fonctionne directement dans ton navigateur.
            </p>

        </div>

    `;

}


form.addEventListener(
    "submit",
    function(event) {

        event.preventDefault();

        sendMessage();

    }
);


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter" &&
            !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


input.addEventListener(
    "input",
    function() {

        this.style.height =
            "auto";

        this.style.height =
            Math.min(
                this.scrollHeight,
                180
            ) + "px";

    }
);


loadAI();

</script>

</body>
</html>
